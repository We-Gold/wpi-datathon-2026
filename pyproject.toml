[project]
name = "health"
version = "0.1.0"
description = "Parse Apple Health exports and related formats into one consistent schema."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
]

[project.scripts]
health-prep = "health.cli:main"
health-model = "health.model_cli:main"
health-forecast = "health.forecast_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyrefly>=0.16",
]
notebook = [
    "altair>=5.4",
    "marimo>=0.9",
]
model = [
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "umap-learn>=0.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health"]

[tool.ruff]
line-length = 100
# src still lists notebooks so imports from health resolve as first party there.
src = ["src", "tests", "notebooks"]

# Notebooks are not linted or formatted. marimo owns these files: it rewrites
# them on every edit, and the formatter disagrees with how it lays cells out, so
# the two take turns undoing each other. Nothing here ships, so the cost of
# leaving them alone is low.
#
# force-exclude so that naming a notebook directly, as `ruff check
# notebooks/explore.py`, is skipped too rather than overriding the exclude.
exclude = ["notebooks"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyrefly]
# Notebooks are left out here for the same reason they are left out of ruff.
# marimo owns those files and nothing in them ships.
project-includes = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.marimo.runtime]
# Pick up edits to src/health without restarting the kernel.
auto_reload = "lazy"
# With --watch, mark cells stale when the file changes underneath the server
# rather than ignoring the change.
watcher_on_save = "lazy"
